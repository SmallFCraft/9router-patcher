#   combos-picker-kilo-free-deps: find KHÔNG chứa `)` kết thúc biểu thức, replace cũng không.
# 0.5.109 -> 0.5.111: 3 anchor chết, 0 hấp thụ (scan 74 clean trên tarball pristine
#   0.5.111). locate --all --latest: 0 fixed-likely, 0 applied; không replace nào của
#   74 patch nào khớp sẵn trong pristine -> upstream chưa tự fix patch nào.
#   Remap do re-minify: log-headroom-trim (8895.js, r/s->p/q), opencode-responses-
#   noeffort-minimal (5330.js, E->K), upstream-claude-sse-passthrough (2380.js, ar->as).
