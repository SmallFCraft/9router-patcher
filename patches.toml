# 0.5.69: payload claude (từ Claude Code/headroom) chứa message role:"system" NGAY TRONG
# messages[] — ngoài chuẩn Anthropic API. AgentRouter backend gắt validate lệch index →
# 400 tool_use-without-tool_result. Hoist mọi system message từ messages[1] trở đi lên
# top-level system; giữ nguyên system tại 0 (chuẩn openai). Inject trong translate 86724/318.js
# ngay sau tools-strip của p5. Tên inject $-prefix, JS chỉ dùng nháy kép (TOML literal).

[[patch]]
id = "claude-system-hoist"
order = 12
summary = "Hoist role:system khỏi messages[] lên top-level system (chuẩn Anthropic) trước khi gửi upstream"
why = "AgentRouter backend gắt transform messages rồi validate lệch index → 400 tool_use-without-tool_result trên payload hợp lệ; hoist về shape chuẩn để qua mọi backend"
find = 'j=e.find(a=>a.match(b));var k=function({provider:a,model:b,body:c}){let d=g[b];if("deepseek"!==a||!d||!c)return c;'
replace = 'j=e.find(a=>a.match(b));if(c&&Array.isArray(c.messages)){let $s4=!1;for(let $i=1;$i<c.messages.length;$i++){if(c.messages[$i]&&"system"===c.messages[$i].role){$s4=!0;break}}if($s4){let $sy=[],$ms=[];for(let $i=0;$i<c.messages.length;$i++){const $m=c.messages[$i];if($m&&"system"===$m.role&&$i>0){if(Array.isArray($m.content)){for(const $x of $m.content){if($x&&"text"===$x.type)$sy.push($x)}}else if($m.content){$sy.push({type:"text",text:String($m.content)})}}else{$ms.push($m)}}if($sy.length){const $old=c.system;c.system=$old?Array.isArray($old)?$old.concat($sy):[{type:"text",text:String($old)}].concat($sy):$sy;c.messages=$ms}}}var k=function({provider:a,model:b,body:c}){let d=g[b];if("deepseek"!==a||!d||!c)return c;'

# 2026-09-06 19:43: api.aeramc.su trả 400 code "service_error" tạm thời; bảng t2 không bắt
# status 400 → default khoá model 30s chết hàng loạt. Nhận diện 400+service_error TRƯỚC vòng
# t2: shouldFallback ngay + chỉ khoá 5s. Anchor 1 bản ở 10 file (3 chunks + 7 route bundles).

[[patch]]
id = "service-error-fast-recover"
order = 13
summary = "400 service_error / content-blocked / content-safety: fallback ngay, khoá model 5s thay vì default 30s"
why = "provider trả 400 tạm thời (code service_error) nhưng t2 không phân loại được → khoá model 30s chết hàng loạt; 5s đủ skip burst retry rồi tự thử lại. 2026-09-25: AgentRouter trả 400 {code:'content-blocked',type:'agent_router_api_error'} và relay trả 400 'flagged as high risk by model provider content safety check' — cũng không nằm trong t2 nên e() rơi xuống nhánh `400===a && !401/402/403/429` → shouldFallback:!1 → combo loop 8910.js `if(!i) return b` trả thẳng 400 cho client, Claude Code ngắt session, KHÔNG xoay provider kế tiếp"
find = 'function e(a,b,c=0){let f=b?("string"==typeof b?b:JSON.stringify(b)).toLowerCase():"";for(let b of d.t2)'
replace = 'function e(a,b,c=0){let f=(b instanceof Error?String(b.message||b):b?("string"==typeof b?b:JSON.stringify(b)):"").toLowerCase();if(b instanceof Error||400===a&&(f.includes("service_error")||f.includes("content-blocked")||f.includes("content_blocked")||f.includes("high risk")||f.includes("content safety")||f.includes("cyber security")||f.includes("agent_router_api_error"))||f.includes("upstream non-sse"))return{shouldFallback:!0,cooldownMs:5e3};for(let b of d.t2)'

