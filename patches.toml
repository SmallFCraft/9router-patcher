# 9router patches — nguồn duy nhất.
# 0.5.91 -> 0.5.95: re-minify dịch định danh +1 slot trong 8895.js/8499.js. 12 anchor chết.
#   KHÔNG patch nào bị upstream hấp thụ (0 `applied` trên tarball pristine 0.5.95).
#   Remap thuần rename (find + replace cùng nhau):
#     p7  P -> Q                                        (sse-close-passthrough)
#     p23 aT/aS/av/aC/aq/ar/aj/aK/au -> aU/aT/aw/aD/ar/as/ak/aL/av
#     p27 a_/aq -> a0/ar, body aj -> ak
#     p28 a0/aj -> a1/ak
#     p35 ap -> aq                                      (8499.js)
#     p39 a1/aj -> a2/ak
#   Viết lại cấu trúc (đo byte, không suy đoán):
#     p6  anchor sống nhưng replace gọi P() — 0.5.95 đổi tên hàm đó thành Q()
#     p8  upstream TỰ THÊM completion timer và chiếm slot `P`; hàm once-only giờ là `Q`.
#         replace chèn $G TRƯỚC Q để p6/p7/p9 vẫn gọi được. find mở rộng thành
#         `O=!1,P=null,Q=()=>{if(P&&(clearTimeout(P),P=null),O)return;O=!0;`
#     p10 cả cụm a4..a8 -> a5..a9, retry dùng a0/a2/a3/au/aS/ak (27 tên đổi)
#     p13 upstream thêm tham số thứ 4 `f` (provider) và đổi biến cục bộ thành `g`
#     p14 aZ/au/aS/aR/aj -> a$/av/aT/aS/ak
#     p19 upstream chèn `,a.messages=x(a.messages,c)` trước closer; merge của p19
#         chèn ngay trước lời gọi đó
#     p31 k/j/q -> i/l/u
#   CẠM BẪY đã sập một lần (sáng 2026-09-06): remap `find` mà giữ `replace` của version cũ.
#   `replace` p8 khi đó khai `O=()=>{...}` (O phải là CỜ) và không bao giờ khai `P`, nên 4 lời gọi
#   `P()` còn lại — kể cả 2 lời trong flush() — thành ReferenceError: `node --check` pass, SSE không
#   đóng, gauge activeRequests kẹt. Remap `find` và `replace` CÙNG NHAU, không bao giờ riêng lẻ.
#   (Audit 0.5.95: p8 lặp lại đúng hình dạng này — xem ghi chú p8 ở trên.)
# `order` tường minh: áp theo 1->9.
# `group`: các patch cùng group nằm cùng một file, áp/gỡ atomic (cả nhóm hoặc không cái nào).
# `defines`: patch này định nghĩa symbol mà patch khác trong group gọi -> áp ĐẦU TIÊN, gỡ CUỐI CÙNG.

target_version = "0.5.95"

[[patch]]
id = "connect-timeout-180s"
order = 1
summary = "Connect timeout 60s → 180s"
why = "Node chậm cần lâu hơn mới failover; env var FETCH_CONNECT_TIMEOUT_MS chỉ là lớp thứ hai"
find = 'FETCH_CONNECT_TIMEOUT_MS",6e4'
replace = 'FETCH_CONNECT_TIMEOUT_MS",18e4'

[[patch]]
id = "ua-messages"
order = 2
summary = "Gửi User-Agent claude-cli cho /v1/messages"
why = "AgentRouter trả 401 unauthorized client detected khi UA là \"node\""
find = 'delete h["anthropic-dangerous-direct-browser-access"]'
replace = 'h["User-Agent"]="claude-cli/2.1.92 (external, cli)",delete h["anthropic-dangerous-direct-browser-access"]'

[[patch]]
id = "ua-models-route"
order = 3
summary = "Cùng UA cho provider models fetch"
why = "agentrouter.org/v1/models từ chối UA mặc định (nút refresh models trên trang provider)"
find = 'method:"GET",headers:{"Content-Type":"application/json","x-api-key"'
replace = 'method:"GET",headers:{"Content-Type":"application/json","User-Agent":"claude-cli/2.1.92 (external, cli)","x-api-key"'

[[patch]]
id = "ua-models-agg"
order = 4
summary = "Cùng UA cho per-provider fetch trong /api/models"
why = "chunk dựng header qua d[...] nên cần anchor riêng"
find = 'd["anthropic-version"]="2023-06-01",d.Authorization='
replace = 'd["anthropic-version"]="2023-06-01",d["User-Agent"]="claude-cli/2.1.92 (external, cli)",d.Authorization='

[[patch]]
id = "tools-strip-custom"
order = 5
summary = "Bỏ type:\"custom\" khỏi tools trước khi gửi upstream"
why = "AgentRouter 2026-09-04 trả 400 unknown variant `custom`; dạng no-type được chấp nhận ở mọi nơi"
find = 'function h({provider:a,model:b,body:c}){let i=d.xq[a]?.reasoningInject,j=e.find(a=>a.match(b));'
replace = 'function h({provider:a,model:b,body:c}){if(c&&Array.isArray(c.tools))c.tools=c.tools.map(t=>{if(t&&"custom"===t.type){let u={...t};delete u.type;return u}return t});let i=d.xq[a]?.reasoningInject,j=e.find(a=>a.match(b));'

[[patch]]
id = "sse-close-translate"
order = 6
group = "sse-hang"
summary = "Đóng SSE sau terminal event (nhánh dịch)"
why = "motomoto.lol giữ TCP mở sau message_stop nên Claude Code quay mãi; terminate() bỏ qua flush() nên phải tự phát tail event, ghi usage (P) và giảm gauge ($G)"
find = 'N=!0,s&&(M=!0);continue}'
replace = 'N=!0,s&&(M=!0);{let $z=(0,d.Y8)(c,o,null,C);if($z?.length>0)for(let $y of $z)null!=$y&&f.enqueue(k.encode((0,h.v8)($y,o)));}Q(),$G();setTimeout(()=>{try{f.terminate()}catch{}},50);continue}'

[[patch]]
id = "sse-close-passthrough"
order = 7
group = "sse-hang"
summary = "Đóng SSE sau [DONE] (nhánh passthrough)"
why = "client định dạng openai trên /v1/chat/completions dùng sentinel [DONE]"
find = 'q?.appendConvertedChunk?.(b),f.enqueue(k.encode(b)),d&&Q();continue}'
replace = 'q?.appendConvertedChunk?.(b),f.enqueue(k.encode(b)),d&&Q();if(b&&b.indexOf("[DONE]")>=0){N=!0,Q(),$G(),setTimeout(()=>{try{f.terminate()}catch{}},50)}continue}'

[[patch]]
id = "gauge-guard"
order = 8
group = "sse-hang"
defines = "$G"
summary = "Giảm gauge in-flight đúng một lần ($G)"
why = "stream kết thúc qua patch 6/7 vẫn phải xoá dòng calling trên trang Usage"
find = 'O=!1,P=null,Q=()=>{if(P&&(clearTimeout(P),P=null),O)return;O=!0;'
replace = 'O=!1,P=null,$g=!1,$G=()=>{if($g)return;$g=!0;try{(0,f.uw)(t,p,u,!1)}catch{}},Q=()=>{if(P&&(clearTimeout(P),P=null),O)return;O=!0;'

[[patch]]
id = "gauge-flush-route"
order = 9
group = "sse-hang"
summary = "Đưa decrement lúc flush() qua cùng guard"
why = "tránh giảm gauge hai lần khi cả flush() và patch 6/7 cùng chạy"
find = '(0,f.uw)(t,p,u,!1);try{'
replace = '$G();try{'

