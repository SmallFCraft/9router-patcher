# P40 - Deno Deploy relay: strip header danh tinh client.
# Template deno-deploy: new Headers(request.headers) roi chi xoa 3 header.
# Deno Deploy khong tu tiem IP that vao header nhu CF/Vercel, nhung client tu gui
# x-forwarded-for/x-real-ip/forwarded la du de upstream thay IP that - va x-relay
# chay tren deno deploy van copy nguyen.
# Anchor 1 DONG, unique 1 ban / 1 file tren build hien tai (da do bang engine._js_files).
#
# 2026-10-11: da DO LAI tren production (khong con suy doan tu note cu 2026-10-01).
#   - Vercel: VAN KHONG che duoc IP. Edge tu tiem "Forwarded: for=<IP that>;...;sig=..."
#     luc egress. Handler set x-real-ip=0.0.0.0 thi upstream giu 0.0.0.0, nhung header
#     Forwarded bi Vercel GHI DE HOAN TOAN (co chu ky sig=, khong the override tu code).
#     => P41/P42 (vercel) van GO BO. Dung.
#   - Cloudflare: TRUOC DAY KET LUAN SAI ("geo-block ca dai -> 403"). Do lai 2026-10-11:
#     stock worker ro Cf-Connecting-Ip; sau khi strip 14 header danh tinh thi upstream
#     chi con egress anycast 2a06:98c0:3600::103. Goi THAT key TokenHarbor qua relay CF
#     tra ve 200 + JSON Claude hop le (msg_..., model claude-haiku-5.5), trong khi goi
#     truc tiep tu IP VN tra 403 request_forbidden. => CF CHE DUOC IP, patch da duoc
#     khoi phuc o P42 (relay-strip-client-headers-cf).
#   - CF KHONG dinh bug gzip nhu Netlify: response khong co header Content-Encoding,
#     body plaintext dung => khong can patch drop-content-encoding cho CF.
# Chi tiet bug content-encoding: xem P41b (relay-drop-content-encoding-netlify).

[[patch]]
id = "relay-strip-client-headers-deno"
order = 40
summary = "Deno Deploy relay khong forward header danh tinh client ra upstream"
why = "Template deno-deploy copy new Headers(request.headers), chi xoa x-relay-target/x-relay-path/host. Cac header x-forwarded-for / x-real-ip / forwarded do client tu gui duoc forward nguyen sang upstream nen upstream thay IP that - proxy mat tac dung che IP. Strip cac header do thi upstream chi con thay egress IP cua Deno Deploy. 2026-10-01: strip them accept-encoding de upstream tra identity (plaintext); tranh loi Deno tu decompress nhung van forward content-encoding: br/gzip khien Node undici/9router decompress lan 2 va crash 'terminated' (502)."
find = '''  newHeaders.delete("host");'''
replace = '''  newHeaders.delete("host");
  newHeaders.delete("x-forwarded-for");
  newHeaders.delete("x-forwarded-host");
  newHeaders.delete("x-forwarded-proto");
  newHeaders.delete("x-real-ip");
  newHeaders.delete("forwarded");
  newHeaders.set("accept-encoding", "identity");'''

# P41 - Netlify relay: strip header danh tinh client + set accept-encoding identity.
# Template netlify copy { ...event.headers } roi chi xoa x-relay-target/path va host.
# Netlify Functions tiêm x-nf-client-connection-ip (chứa IP thật của client) và forward
# cả client-ip / x-forwarded-* / forwarded do client tự gửi sang upstream, khiến TokenHarbor
# hoặc provider chặn theo IP (401/403). Strip toàn bộ các header này tại code handler của
# Lambda để upstream chỉ thấy egress IP của AWS/Netlify (us-east-2).
# Đồng thời ép accept-encoding: identity để tránh lỗi upstream trả gzip/br nhưng template
# ép sang string utf8 gây rác byte.

[[patch]]
id = "relay-strip-client-headers-netlify"
order = 41
summary = "Netlify relay khong forward header danh tinh client ra upstream"
why = "Template netlify forward ca x-nf-client-connection-ip (Netlify inject, chua IP that), client-ip, x-forwarded-* va forwarded sang upstream khien TokenHarbor/AI provider thay IP VN va block (401/403). Strip cac header do de upstream chi thay egress IP Netlify/AWS (us-east-2). Single-line anchor tranh lech byte tren Windows/tarball."
find = 'if (lower === "x-relay-target" || lower === "x-relay-path" || lower === "host") {'
replace = 'if (lower === "x-relay-target" || lower === "x-relay-path" || lower === "host" || lower === "x-forwarded-for" || lower === "x-forwarded-host" || lower === "x-forwarded-proto" || lower === "x-real-ip" || lower === "forwarded" || lower === "client-ip" || lower === "x-nf-client-connection-ip") {'

[[patch]]
id = "relay-drop-content-encoding-netlify"
order = 42
summary = "Xoa content-encoding khoi response Netlify vi fetch da tu giai nen"
why = "Node fetch (undici) trong Netlify Lambda tu dong giai nen body gzip/br nhung giu nguyen header content-encoding trong upstream.headers. Lambda copy nguyen header sang responseHeaders va tra body plaintext, khien client (curl/9router) tuong van la gzip nen giai nen lan 2 va crash 'Not a gzipped file' / 502. Xoa header nay de responseHeaders khop voi body plaintext thuc te."
find = 'const contentType = upstream.headers.get("content-type") || "";'
replace = 'delete responseHeaders["content-encoding"];delete responseHeaders["Content-Encoding"];const contentType = upstream.headers.get("content-type") || "";'

# P42b - Cloudflare Worker relay: strip header danh tinh client (khoi phuc 2026-10-11).
# NOTE: order 53 thay vi 43 vi cac patch 43-52 da co (proxy-pool lifecycle). Order chi
# quyet dinh thu tu apply va day deu la cac patch doc lap tren file khac nhau nen khong can don.
# Template CF (worker index.js): new Headers(request.headers) roi chi xoa 3 header
# x-relay-target/x-relay-path/host. Do 2026-10-11: stock ro Cf-Connecting-Ip = IP that.
# Danh sach 14 header nay la cai do duoc do: strip no thi upstream chi con thay egress
# anycast 2a06:98c0:3600::103 (khong con IP VN). Khong can patch content-encoding cho CF
# vi response khong co header do (da do, body plaintext dung). $h de tranh va cham minifier.

[[patch]]
id = "relay-strip-client-headers-cf"
order = 53
summary = "Cloudflare Worker relay khong forward header danh tinh client ra upstream"
why = "Template CF copy new Headers(request.headers) chi xoa 3 header, nen Cf-Connecting-Ip (CF tu tiem, chua IP that cua client) va cac x-forwarded-*/forwarded/client-ip duoc forward ra upstream. Do 2026-10-11: goi THAT tokenharbor qua relay CF sau strip tra ve 200 JSON Claude hop le, truc tiep tu IP VN tra 403 request_forbidden -> CF che duoc IP bang cach strip header nay."
