# P54 - opencode free transport thieu thinkingFormat -> fallback nham "zai" -> 400 unknown field thinking.
# Do 2026-10-17 tren 0.5.104, repro that:
#   POST claude-opus-5 -> glm-5.3-flash-free, FMT claude->openai, THINK:max, ACC:Publ
#   -> 400 {"error":{"param":"thinking","type":"invalid_request_error",
#          "message":"... json: unknown field \"thinking\""}}
#   URL: https://opencode.ai/inference/v1/chat/completions
#
# Chuoi quyet dinh (server/chunks/8499.js, module 52136 `function z`):
#   1. `f.xq[c]?.thinkingFormat` cua provider "opencode" = undefined (transport khong khai).
#   2. `getCapabilitiesForModel("opencode","glm-5.3-flash-free")` khong co entry per-provider
#      (bang 24.js chi co "opencode-go", KHONG co "opencode") -> roi fallback pattern
#      `*glm-5.3*` -> thinkingFormat:"zai".
#   3. Set loai tru `m` trong 8499.js KHONG chua "zai" -> nhan "zai" cho target format openai.
#   4. `case"zai"` set `b.thinking={type:"enabled"}` -> body OpenAI dinh field thinking -> gateway chan.
#
# Tien le upstream: provider "opencode-go" DA khai `thinkingFormat:"openai"` cho dung glm-5.3-flash;
# ban "opencode" free bi sot. Patch khai thang o cap transport, giong opencode-go.
# Sau patch roi vao `case"openai"` -> chi set reasoning_effort, khong emit `thinking`.
# Khong anh huong model khac cua provider: muse-spark-1.2/1.3 co targetFormat openai-responses rieng,
# union-alpha targetFormat claude, jev-1.13 kind systemone - deu route rieng.
#
