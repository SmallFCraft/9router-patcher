# P29 — accept text/plain as SSE: some providers (agentrouter.org/glm-5.3) return valid SSE
# body under content-type text/plain. The MIME guard blocks ANY non-SSE non-JSON response,
# throwing `upstream non-SSE: 200` and locking every key 5s. Fix: also accept text/plain in
# the guard — if the body is actually not SSE, downstream $pk peek catches it as
# empty-stream-fallback (P16). Anchor = MIME guard in 8895.js (1 occurrence).

[[patch]]
id = "accept-text-plain-as-sse"
order = 29
summary = "Allow text/plain through MIME guard (some providers send SSE as text/plain)"
why = "agentrouter.org/glm-5.3 returns valid SSE events under content-type: text/plain; charset=utf-8 -> MIME guard blocks + locks all keys 5s; downstream peek already catches empty streams"
find = 'if(N&&!N.includes("text/event-stream")&&!N.includes("application/json"))'
replace = 'if(N&&!N.includes("text/event-stream")&&!N.includes("application/json")&&!N.includes("text/plain"))'

