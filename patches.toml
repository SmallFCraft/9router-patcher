# chuỗi không chứa `'` và `\` nên nhúng TOML literal an toàn.
# Lưu ý: đây là chunk TĨNH của Next.js, không phải server chunk — engine vẫn quét
# (rglob *.js trên cả build) nhưng `node --check` chạy trên ESM/JSX bundle vẫn pass.

