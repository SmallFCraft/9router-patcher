order = 15
summary = "Deadline tổng 240s (env 9R_ATTEMPT_DEADLINE_MS) cho 1 attempt upstream — cắt stream kẹt"
why = "STALL/FIRST_CHUNK chỉ đo giữa-chunk; stream nhỏ giọt 7 phút không ai cắt, client tự hủy rồi router vẫn chạy tiếp phí"
