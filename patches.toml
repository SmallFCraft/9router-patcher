replace = '''let r=h.split(".")[0],s=`https://${i}.${r}.deno.net`;console.log("Deno deployUrl:",s);let t=await (0,e.ZO)({name:i,proxyUrl:s,type:"deno",noProxy:"",isActive:!0,strictProxy:!1,deployMeta:{type:"deno",denoToken:c,orgDomain:h,appId:l.id,projectName:i}});'''

[[patch]]
id = "proxy-pool-remote-teardown-on-delete"
order = 45
summary = "Xoa tai nguyen da deploy tren Cloudflare/Vercel/Deno khi xoa proxy pool"
why = "DELETE /api/proxy-pools/[id] truoc day chi xoa row trong DB, Worker/Project/App tren provider van song va van tinh quota. Teardown chay TRUOC khi xoa local va la best-effort: moi loi remote (token het han, mat mang, provider doi API) bi nuot trong try/catch cua $teardown nen khong bao gio chan viec xoa local. AbortSignal.timeout(15e3) de mot provider treo khong giu request xoa lau. force=true cho Cloudflare de xoa duoc Worker con binding. Doc $p mot lan qua (0,e.hr)(a) thay vi goi lai hai lan."
find = '''async function h(a,{params:b}){try{let{id:a}=await b;if(!await (0,e.hr)(a))return d.NextResponse.json({error:"Proxy pool not found"},{status:404});let c=await (0,e.getProviderConnections)(),f=function(a=[],b){return a.filter(a=>a?.providerSpecificData?.proxyPoolId===b).length}(c,a);if(f>0)return d.NextResponse.json({error:"Proxy pool is currently in use",boundConnectionCount:f},{status:409});return await (0,e.Yd)(a),d.NextResponse.json({success:!0})}'''
replace = '''async function $teardown(p){try{let m=p&&p.deployMeta;if(!m)return;if("cloudflare"===m.type&&m.accountId&&m.apiToken&&m.scriptName)await fetch("https://api.cloudflare.com/client/v4/accounts/"+m.accountId+"/workers/scripts/"+encodeURIComponent(m.scriptName)+"?force=true",{method:"DELETE",headers:{Authorization:"Bearer "+m.apiToken},signal:AbortSignal.timeout(15e3)});else if("vercel"===m.type&&m.vercelToken&&(m.projectId||m.projectName))await fetch("https://api.vercel.com/v9/projects/"+encodeURIComponent(m.projectId||m.projectName),{method:"DELETE",headers:{Authorization:"Bearer "+m.vercelToken},signal:AbortSignal.timeout(15e3)});else if("deno"===m.type&&m.denoToken&&m.appId)await fetch("https://api.deno.com/v2/apps/"+encodeURIComponent(m.appId),{method:"DELETE",headers:{Authorization:"Bearer "+m.denoToken},signal:AbortSignal.timeout(15e3)})}catch(e){console.warn("[9router] remote teardown skipped:",e&&e.message)}}
async function h(a,{params:b}){try{let{id:a}=await b;let $p=await (0,e.hr)(a);if(!$p)return d.NextResponse.json({error:"Proxy pool not found"},{status:404});let c=await (0,e.getProviderConnections)(),f=function(a=[],b){return a.filter(a=>a?.providerSpecificData?.proxyPoolId===b).length}(c,a);if(f>0)return d.NextResponse.json({error:"Proxy pool is currently in use",boundConnectionCount:f},{status:409});await $teardown($p);return await (0,e.Yd)(a),d.NextResponse.json({success:!0})}'''

[[patch]]
id = "proxy-pool-redact-token-list"
order = 46
summary = "Khong tra credential deploy ve browser o GET /api/proxy-pools"
why = "deployMeta chua apiToken/vercelToken/denoToken. Tra nguyen object ve UI la ro secret (quy tac repo: khong lo API key/provider secret). $redact chay ngay sau (0,e.ui)(h) nen ca nhanh som (khong includeUsage) lan nhanh muon deu da sach; map lan hai chi them boundConnectionCount nen khong redact chong (redact chong se lat hasToken ve false)."
find = '''let i=await (0,e.ui)(h);if(!g)return d.NextResponse.json({proxyPools:i});let j=await (0,e.getProviderConnections)(),k=function(a=[]){let b=new Map;for(let c of a){let a=c?.providerSpecificData?.proxyPoolId;a&&b.set(a,(b.get(a)||0)+1)}return b}(j),l=i.map(a=>({...a,boundConnectionCount:k.get(a.id)||0}));'''
replace = '''let i=(await (0,e.ui)(h)).map(function $redact(p){if(!p||!p.deployMeta)return p;let{apiToken:$a,vercelToken:$v,denoToken:$d,...$m}=p.deployMeta;return{...p,deployMeta:{...$m,hasToken:!(!$a&&!$v&&!$d)}}});if(!g)return d.NextResponse.json({proxyPools:i});let j=await (0,e.getProviderConnections)(),k=function(a=[]){let b=new Map;for(let c of a){let a=c?.providerSpecificData?.proxyPoolId;a&&b.set(a,(b.get(a)||0)+1)}return b}(j),l=i.map(a=>({...a,boundConnectionCount:k.get(a.id)||0}));'''

[[patch]]
id = "proxy-pool-redact-token-detail"
order = 47
summary = "Khong tra credential deploy ve browser o GET /api/proxy-pools/[id]"
why = "Cung ro secret nhu P46 nhung o route chi tiet. Giu lai hasToken de UI biet pool nao con du credential de don tai nguyen remote."
find = '''if(!c)return d.NextResponse.json({error:"Proxy pool not found"},{status:404});return d.NextResponse.json({proxyPool:c})}catch(a){return console.log("Error fetching proxy pool:",a)'''
replace = '''if(!c)return d.NextResponse.json({error:"Proxy pool not found"},{status:404});let $c=c;if($c.deployMeta){let{apiToken:$a,vercelToken:$v,denoToken:$d,...$m}=$c.deployMeta;$c={...$c,deployMeta:{...$m,hasToken:!(!$a&&!$v&&!$d)}}}return d.NextResponse.json({proxyPool:$c})}catch(a){return console.log("Error fetching proxy pool:",a)'''

