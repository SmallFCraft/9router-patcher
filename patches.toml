find = 'function e(a,b,c=0,f=null){let g=b?("string"==typeof b?b:JSON.stringify(b)).toLowerCase():"";for(let b of d.t2)'
replace = 'function e(a,b,c=0,f=null){let g=(b instanceof Error?String(b.message||b):b?("string"==typeof b?b:JSON.stringify(b)):"").toLowerCase();if(b instanceof Error||400===a&&(g.includes("service_error")||g.includes("content-blocked")||g.includes("content_blocked")||g.includes("high risk")||g.includes("content safety")||g.includes("cyber security")||g.includes("agent_router_api_error"))||g.includes("upstream non-sse"))return{shouldFallback:!0,cooldownMs:5e3};for(let b of d.t2)'

