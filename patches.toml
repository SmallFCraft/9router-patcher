# vậy — chớp ngẫu, gặp ở glm-5.3-flash 17:12:19) → module 5016 convert bằng k.F(81626) ra null →
# 502 "Invalid SSE response for non-streaming request" + kho model/key 30s oan. Group này thêm
# MỘT lần retry: caller (module 92500) nhả closure `retry` (aY.execute stream:true, AbortSignal
# 30s); module 5016 khi k.F=null thì gọi retry, đọc stream TĂNG DẦN (thoát sớm ở message_stop —
# giữ ngữ nghĩa sse-hang), tự aggregate frame anthropic SSE thành message JSON đúng shape
# `a.json()` vốn có rồi đẩy vào J. Mọi nhánh lỗi (retry fail, frame rác, thiếu message_stop,
# timeout) rơi về đúng 502 cũ — từng patch áp một mình cũng chỉ no-op. KHÔNG remap 1-chữ: mọi
# tên inject đều có tiền tố $.

