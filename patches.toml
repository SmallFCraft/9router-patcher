# 0.5.69: payload claude (từ Claude Code/headroom) chứa message role:"system" NGAY TRONG
# messages[] — ngoài chuẩn Anthropic API. AgentRouter backend gắt validate lệch index →
# 400 tool_use-without-tool_result. Hoist mọi system message từ messages[1] trở đi lên
# top-level system; giữ nguyên system tại 0 (chuẩn openai). Inject trong translate 86724/318.js
# ngay sau tools-strip của p5. Tên inject $-prefix, JS chỉ dùng nháy kép (TOML literal).

[[patch]]
id = "claude-system-hoist"
order = 12
summary = "Hoist role:system khỏi messages[] lên top-level system (chuẩn Anthropic) trước khi gửi upstream"
why = "AgentRouter backend gắt transform messages rồi validate lệch index → 400 tool_use-without-tool_result trên payload hợp lệ; hoist về shape chuẩn để qua mọi backend"
find = 'j=e.find(a=>a.match(b));var k=function({provider:a,model:b,body:c}){let d=g[b];if("deepseek"!==a||!d||!c)return c;'
replace = 'j=e.find(a=>a.match(b));if(c&&Array.isArray(c.messages)){let $s4=!1;for(let $i=1;$i<c.messages.length;$i++){if(c.messages[$i]&&"system"===c.messages[$i].role){$s4=!0;break}}if($s4){let $sy=[],$ms=[];for(let $i=0;$i<c.messages.length;$i++){const $m=c.messages[$i];if($m&&"system"===$m.role&&$i>0){if(Array.isArray($m.content)){for(const $x of $m.content){if($x&&"text"===$x.type)$sy.push($x)}}else if($m.content){$sy.push({type:"text",text:String($m.content)})}}else{$ms.push($m)}}if($sy.length){const $old=c.system;c.system=$old?Array.isArray($old)?$old.concat($sy):[{type:"text",text:String($old)}].concat($sy):$sy;c.messages=$ms}}}var k=function({provider:a,model:b,body:c}){let d=g[b];if("deepseek"!==a||!d||!c)return c;'

