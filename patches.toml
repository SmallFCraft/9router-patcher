# P64 - response.incomplete cua openai-responses khong duoc converter xu ly: v() roi xuong
# `return null` -> stream convert ra RONG -> probe p16 ket luan "empty stream (no content)"
# -> classifier hk khong match t2 -> khoa model 30s -> xoay het account (do duoc: 7 account
# /40s cho 1 request, moi lan day lai 202k token). Nguyen nhan that thuong la reasoning an
# het output budget (usage.output_tokens_details.reasoning_tokens = max_output_tokens),
# KHONG phai loi account. Phat [Error] kem incomplete_details.reason dung pattern nhanh
# error/response.failed san co -> stream co content -> 200, mot request, khong khoa account.
[[patch]]
id = "responses-incomplete-as-error"
order = 64
summary = "openai-responses response.incomplete -> phat [Error] kem reason thay vi stream rong"
why = "converter v() bo qua response.incomplete -> stream convert rong -> p16 bao 'empty stream (no content)' -> khoa model 30s + xoay sach account cho MOT request (7 account/40s, 202k token/lan). Goc la reasoning an het max_output_tokens, khong phai loi account"
find = 'if("error"===c||"response.failed"===c){if(b.finishReasonSent)return null;let a=d.error||d.response?.error;return a?(b.error=a,b.finishReasonSent=!0,(0,f.k)({id:b.chatId||`chatcmpl-${Date.now()}`,created:b.created||Math.floor(Date.now()/1e3),model:b.model||j.rP},{content:`[Error] ${a.message||JSON.stringify(a)}`},j.bC.STOP)):null}'
replace = 'if("error"===c||"response.failed"===c){if(b.finishReasonSent)return null;let a=d.error||d.response?.error;return a?(b.error=a,b.finishReasonSent=!0,(0,f.k)({id:b.chatId||`chatcmpl-${Date.now()}`,created:b.created||Math.floor(Date.now()/1e3),model:b.model||j.rP},{content:`[Error] ${a.message||JSON.stringify(a)}`},j.bC.STOP)):null}if("response.incomplete"===c){if(b.finishReasonSent)return null;let $rs=d.response||{};b.finishReasonSent=!0;return(0,f.k)({id:b.chatId||`chatcmpl-${Date.now()}`,created:b.created||Math.floor(Date.now()/1e3),model:b.model||j.rP},{content:"[Error] upstream incomplete"+($rs.incomplete_details?": "+JSON.stringify($rs.incomplete_details):"")},j.bC.STOP)}'

