#   log-combo-drop-succeeded (5308.js), 4xx-rotate-instead-of-abort (7187.js),
#   combos-picker-kilo-free-{models,fetch,merge,deps} (5497-fde2bd4447864eac.js),
#   provider-{suggested,custom-vs-free}-dedupe (providers/[id]/page-*.js)
#   Module id đổi: log-combo-drop-succeeded 8910->5308, 4xx-rotate 238->7187,
#   opencode-transport 1321->2359.
#   CẠM BẪY mới (2026-10-24): p35 upstream 0.5.109 thêm prologue streamToolCallIds vào
#   nhánh `if(b===a)return ...` — anchor phải phủ HẾT prologue, nếu không patch chèn guard
