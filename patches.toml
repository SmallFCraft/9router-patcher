# P15 — deadline tổng per-attempt: env 9R_ATTEMPT_DEADLINE_MS (default 240000, <=0 tắt);
# cắt bằng c.handleError + c.abort() đúng cơ chế fallback. Watcher g() chỉ 1 bản trong 8895.js.
# LỊCH SỬ 2026-09-19 — hai lỗi của chính patch này, cùng lộ trong log prod:
#  1) replace chèn `Date.now()-x` nhưng g() khai báo i,j,k,l,m,n,o,p — KHÔNG có `x`. Re-anchor
#     0.5.81 remap find (q/p/m/o) mà bỏ sót replace → node --check vẫn pass (identifier hợp lệ)
#     còn timer nổ ReferenceError. Next.js log rồi nuốt (router-server.js:648) nên chỉ thành spam
#     `⨯ uncaughtException` chứ không giết process. Dùng `n` = mốc bắt đầu attempt (upstream đã
#     dùng cho dur=) — KHÔNG dùng `l` = mốc chunk cuối, bị transform gán lại mỗi chunk.
#  2) $td không được clearTimeout ở đâu cả, mà p() (đường dọn DUY NHẤT) lại chạy mỗi chunk qua
#     q() nên không thể nhét clear vào đó — nhét vào p() thì hạn chót chết ngay chunk đầu. Thay
#     bằng guard `!i`: i chỉ null sau terminal (handleComplete/Error/Disconnect/abort đều gọi p()),
#     nên timer sót của request đã xong thành no-op thay vì gọi handleError()/abort() lên attempt
#     đã đóng (fallback + log lỗi ma).

[[patch]]
