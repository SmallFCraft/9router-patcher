# không toolhist+không thinking = 13 ok/0 err. Nên chỉ tắt thinking đúng ô đang lỗi.
# Guard chèn cuối khối messages (sau mọi transform, trước khối tools), chỉ đụng
# anthropic-compatible + có tool history + client KHÔNG thể hiện ý định thinking nào.

[[patch]]
id = "responses-thinking-history-400"
order = 31
summary = "openai-responses + tool history → thinking:{type:disabled} (AgentRouter 400 thinking-replay)"
why = "responses→claude translator không sinh thinking block, normalizer lại gate dummy-thinking sau thinking.type===\"enabled\" nên body không có thinking param; relay DeepSeek của agentrouter.org chạy thinking mặc định và 400 'content[].thinking must be passed back' cho mọi key"
