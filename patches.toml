replace = 'c.content=k,j&&!f&&a&&c.content.unshift(q(b))}}}};(function(){try{if(!a||"string"!=typeof b)return;if(!b.startsWith("anthropic-compatible"))return;if(a.thinking||a.reasoning_effort||a.reasoning||a.output_config&&a.output_config.effort)return;if(!Array.isArray(a.messages))return;if(!a.messages.some($m=>$m&&"assistant"===$m.role&&Array.isArray($m.content)&&$m.content.some($x=>$x&&"tool_use"===$x.type)))return;a.thinking={type:"disabled"}}catch{}})();if(a.tools&&Array.isArray(a.tools)){'

# P33/P34 — openai-responses param 400 trên opencode.ai/zen/v1/responses (muse-spark-*).
# Cả hai lỗi phát sinh trong CÙNG transformRequest của class K (chunks/318.js) — bước cuối
# trước khi gửi upstream, sau P27 (8895.js) và sau mọi normalizer khác:
#  (a) `max_output_tokens` < 16 → 400 "The number must be `>= 16`". P27 chỉ floor `max_tokens`;
#      tới lượt class K thì giá trị đã đổi tên thành `max_output_tokens` → P27 không thấy gì.
#      Floor ngay tại đây, cùng ngưỡng 16 với P27.
#  (b) `reasoning.effort` = "none"/"off" (THINK:off) → 400 "not supported ... Supported values:
#      [minimal, low, medium, high, xhigh, max]". Upstream chỉ down-clamp max/ultra theo capability
#      list, KHÔNG clamp none → nâng lên "minimal" (thấp nhất được chấp nhận).
# Anchor: mỗi find đúng 1 bản trong chunks/318.js (opencode-go có bản `delete e.*` riêng — cố
# ý KHÔNG đụng, URL /zen/go/v1/responses chưa đo lỗi).

[[patch]]
id = "opencode-responses-maxtokens-floor"
order = 33
summary = "Floor max_output_tokens >= 16 trong opencode responses transform (chống 400)"
why = "opencode.ai 400 '`max_output_tokens` The number must be `>= 16`'; P27 chỉ đụng max_tokens còn class K đã đổi tên field trước khi gửi"
find = 'delete b.max_tokens,delete b.max_completion_tokens,function(a,b){let c=b.reasoning,'
replace = 'void 0!==b.max_output_tokens&&"number"==typeof b.max_output_tokens&&b.max_output_tokens<16&&(b.max_output_tokens=16),delete b.max_tokens,delete b.max_completion_tokens,function(a,b){let c=b.reasoning,'

