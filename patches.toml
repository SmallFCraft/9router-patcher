replace = 'q=()=>{p(),i=setTimeout(()=>{i=null,m="stream stall timeout",(0,e.s)(o,`STALL TIMEOUT ${h}ms | chunks=${j} | bytes=${k} | sinceLast=${Date.now()-l}ms`),c.handleError?.(Error("stream stall timeout")),c.abort?.()},h)},$tot=(+process.env["9R_ATTEMPT_DEADLINE_MS"]||240000),$td=$tot>0?setTimeout(()=>{if(!i)return;(0,e.s)(o,`ATTEMPT DEADLINE total=${Date.now()-n}ms (9R_ATTEMPT_DEADLINE_MS=${$tot})`),c.handleError?.(Error(`attempt deadline exceeded ${Date.now()-n}ms`)),c.abort?.()},$tot):null,'

# P16 — empty-stream→fallback: module 20623 hàm o/M trả {success:!0,response} NGAY LÚC HEADER
# về → combo quyết định trước khi biết stream rỗng (am/mt trả OUT 0 59-100%). Peek pipe đã-
# convert: tích đệm tới khi thấy evidence (text_delta/input_json_delta/delta.content/"text":/
# tool_calls/function_call/output_text.delta — thinking KHÔNG tính) rồi mới trả stream live;
# EOF sạch không evidence → {success:!1,status:502} đi đường khóa+fallback vk/hk như 5xx.
# read() throw → ném tiếp cho combo catch. Anchor duy nhất 1 bản ở 8895.js.
# 2026-10-21: 3 lỗi đo được trên ar/gpt-6.1-sol (body 773KB, 202k token):
#  (a) peek chờ EOF → upstream im 195-200s mới kết luận rỗng → $end (terminal event)
#      cắt vòng đọc ngay khi thấy response.completed/failed/incomplete/error/message_stop.
#  (b) 502 luôn trả message generic → classifier hk không match t2 {"text":"rate limit"}
#      → khoá model 30s → 7 account xoay vòng, mỗi vòng lại đẩy 202k token → Azure
#      rate-limit tầng 2. $why lấy message/reason của upstream để 502 mang lý do thật.
#  (c) `tool_calls` false-positive với "max_tool_calls":null / "parallel_tool_calls":true
#      trong response.created → coi stream chết là stream sống. (?<![A-Za-z_]) chặn cả
#      hai key. 2026-10-21 (review): $ev bỏ content_block_start (empty text block của
#      text block thường gây false LIVE) và thêm "type":"tool_use" — tool call không
#      đối số trên claude passthrough chỉ có block start/stop, không delta nào.
#  (d) $er thêm (?!upstream incomplete) — sentinel P64 (response.incomplete → [Error]
#      upstream incomplete: ...) là CONTENT hợp lệ, không được covert thành 502, nếu
#      không vòng khoá-model 30s mà P64 chặn quay lại ngay với client claude-format.
# Lưu ý: probe đọc stream ĐÃ CONVERT (claude/openai), không phải raw responses.
# LỊCH SỬ: lần áp đầu (01:4x) TypeError "reading success" — ROOT CAUSE (stack 01:55, diag): tôi
# biến `return A.catch(...),{success...}` (comma-expr) thành `return A.catch(...);` → early-return
# chính promise save-requestDetails (resolve undefined) → o/wk resolve undefined → z đọc q.success
# trên undefined. Fix: bỏ hẳn `return` đầu (thành statement `;(...)`); find mở rộng gồm
# `;return(0,l.ox)(...` để anchor vẫn duy nhất 1 bản.

