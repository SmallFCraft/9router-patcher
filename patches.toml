# P65-P67: workbuddy-realm — codebuddy-intl bi Tencent chan 403 code 11128
# "request illegal / channel verification" (do 2026-10-23 ngay tren may). 9router gia
# like client IDE (UA IDE/2.108.1 + X-IDE-Type: IDE + thieu Origin/Referer); workbuddy2api
# (ckldy/workbuddy2api, doc 2026-10-23) chay duoc cung ngay dich vu vi dung realm
# www.workbuddy.ai + UA CLI/2.63.2 + X-IDE-Type: CLI. Perf thêm Origin/Referer khong lam
# duoc: adapter 96179 buildHeaders khong co hooks cho oauth, ma providerSpecificData xu
# ly rieng tung connection (OAuth khong luu uid/enterprise/domain). Chi con dao can:
# doi ca intl realm sang workbuddy.ai + gia like CLI client. codebuddy-cn (realm
# copilot.tencent.com) khong bi anh huong — 3 patch nay chi cham chuoi
# "codebuddy-intl"/"www.codebuddy.ai". id/alias giu nguyen (connection cu van dung duoc).
# Standalone (khong group): engine bat buoc anchor cua group nam CUNG mot file, ma 3 patch
# nay trai 4 file (1892/6100/7011/1321). Apply-all van atomic — _preflight raise truoc
# moi write neu bat ky anchor nao chet.

[[patch]]
id = "workbuddy-conversation-headers"
order = 68
summary = "codebuddy-intl: them X-Conversation-* header family (gate channel verification)"
why = "Tencent cong verify tra 400 11128 \"request illegal\" khi chat thieu bo header X-Conversation-ID + X-Conversation-Request-ID + X-Conversation-Message-ID (A/B tren 0.5.104 + issue decolua/9router#5005: du 3 -> 200 SSE, thieu 1 -> 400). Executor codebuddy-intl khong override buildHeaders nen chen vao buildHeaders adapter base (6249.js module 96179) sau hook loop, gate theo this.provider. Phai dung globalThis.crypto.randomUUID(): tham so e cua buildHeaders shadow bien module e=node:crypto, goi (0,e.randomUUID)() ra TypeError runtime 502 (do 2026-10-23)."
find = 'for(let b of i.hooks||[])s[b]?.(h,a);'
replace = 'for(let b of i.hooks||[])s[b]?.(h,a);if("codebuddy-intl"===this.provider||"workbuddy"===this.provider){let $9rKey=e?.session_id||e?.prompt_cache_key||e?.conversation_id||(e?.messages?.[0]?.content||"wbi");h["X-Conversation-ID"]="wb-"+($9rKey+"").replace(/[^a-z0-9]/gi,"").slice(0,32);h["X-Conversation-Request-ID"]=globalThis.crypto.randomUUID();h["X-Conversation-Message-ID"]=globalThis.crypto.randomUUID()}'

