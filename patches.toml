why = "Ham y() refresh token hardcode provider id 'codebuddy-intl' va host codebuddy.ai. Doi y(a,b,c='codebuddy-intl') de khi goi y(token,log,'workbuddy') thi: h(c,...) ghi dung audit log cho provider workbuddy; d.sr[c] lay dung refreshUrl va userAgent tu config rieng; X-Domain dung www.workbuddy.ai (tranh 401 Authorization Required luc refresh)."
find = "async function y(a,b){return a?h(\"codebuddy-intl\",a,async()=>{let c=d.sr[\"codebuddy-intl\"]||{},e=await fetch(c.refreshUrl,{method:\"POST\",headers:{\"Content-Type\":\"application/json\",Accept:\"application/json\",\"User-Agent\":c.userAgent,\"X-Requested-With\":\"XMLHttpRequest\",\"X-Domain\":\"www.codebuddy.ai\",\"X-Refresh-Token\":a,\"X-Auth-Refresh-Source\":\"plugin\",\"X-Product\":\"SaaS\"},body:\"{}\"});"
replace = "async function y(a,b,$p=\"codebuddy-intl\"){return a?h($p,a,async()=>{let c=d.sr[$p]||{},e=await fetch(c.refreshUrl,{method:\"POST\",headers:{\"Content-Type\":\"application/json\",Accept:\"application/json\",\"User-Agent\":c.userAgent,\"X-Requested-With\":\"XMLHttpRequest\",\"X-Domain\":$p===\"workbuddy\"?\"www.workbuddy.ai\":\"www.codebuddy.ai\",\"X-Refresh-Token\":a,\"X-Auth-Refresh-Source\":\"plugin\",\"X-Product\":\"SaaS\"},body:\"{}\"});"

[[patch]]
id = "workbuddy-icon"
order = 80
summary = "Avatar WorkBuddy: tra logo that (teal #01C886) thay vi workbuddy.png (ban copy CodeBuddy)"
why = "Build upstream co app/public/providers/workbuddy.png nhung file do byte-identical voi codebuddy-intl.png (cung md5 a1664bdd5eda48696699e49d62957f6c) nen dashboard hien avatar CodeBuddy tim cho WorkBuddy. Khong the sua file (engine chi patch text + node --check), va file png moi se mat sau moi lan npm install. Logo that cua www.workbuddy.ai la SVG teal #01C886 (favicon cua site). Patch nham vao resolver icon module 8247 (HY) — chokepoint duy nhat ma providers list, trang [id], quota, combos, basic-chat deu di qua — nen mot cho sua phu het call-site. Tra data-URI base64 de khong phu thuoc file nao tren dia."
find = 'return t?`/providers/${t}.png`:null}'
replace = 'return "workbuddy"===t?"data:image/svg+xml;base64,":`/providers/${t}.png`}'

[[patch]]
id = "wreq-js-loader-resolve"
order = 81
summary = "Loader wreq-js: sua (void 0).resolve -> require.resolve de nhanh npm-install chay duoc"
why = "Module 20742 (5330.js + 3697.js) load optional dep wreq-js: 1) import() -> m(a) chan MODULE_NOT_FOUND; 2) c(48565)(pathToFileURL((void 0).resolve(a)).href) -> nhanh CJS, nhung (void 0) la undefined nen nem TypeError 'Cannot read properties of undefined (reading resolve)', KHONG phai MODULE_NOT_FOUND -> m(a) false -> rethrow ngay -> khong bao gio toi buoc 3 (npm install vao <DATA_DIR>/runtime) -> API tra 502 'wreq-js unavailable'. Thay (void 0) bang require.resolve(a) (require that trong scope chunk, da do: typeof require==='function') de nhanh 2 nem MODULE_NOT_FOUND dung nghia -> roi xuong buoc 3 cai dat. Loi nay co ca tren 0.5.109 (khong phai hoi quy cua patch nao) va khong patch nao khac cham module 20742. Sua o day thay vi cai tay wreq-js vi buoc 3 tu cai dung version khai trong k[] ('^3.2.0')."
find = 'try{return await c(48565)((0,i.pathToFileURL)((void 0).resolve(a)).href)}catch(a){if(!m(a))throw a}'
replace = 'try{return await c(48565)((0,i.pathToFileURL)(require.resolve(a)).href)}catch(a){if(!m(a))throw a}'

[[patch]]
id = "wreq-js-loader-tolerate-typeerror"
order = 82
summary = "Loader wreq-js: coi TypeError cua nhanh resolve la 'khong tim thay' de roi xuong npm-install"
why = "Phong thu sau wreq-js-loader-resolve: neu mot ban build sau doi require.resolve() thanh bieu thuc khac nem TypeError, m(a) van tra false va loader chet dung nhu cu. Mo rong m(a) nhan them TypeError chi khi message khop 'reading .resolve' — dung pham vi, khong nuot loi khac. Khong gate theo provider: module 20742 dung chung cho ca Grok Web (22115) va OpenCode free tier (63094)."
find = 'function m(a){let b=String(a?.code||"");return"MODULE_NOT_FOUND"===b||"ERR_MODULE_NOT_FOUND"===b}'
replace = 'function m(a){let b=String(a?.code||"");return"MODULE_NOT_FOUND"===b||"ERR_MODULE_NOT_FOUND"===b||"TypeError"===a?.name&&/reading .resolve/.test(String(a?.message||""))}'
