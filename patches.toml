# P25/P26 — MCP bridge spawn trên Windows. `spawn("npx")` không tìm được extension `.cmd`
# (ENOENT); đổi sang `npx.cmd` lại làm Node ném đồng bộ EINVAL vì .cmd không executable trực tiếp.
# Spawn node.exe với npx-cli.js bỏ hẳn shell: an toàn với args và chạy trên cả Windows/POSIX.
# P26 vẫn giữ listener: executable/path hỏng phải log thay vì văng khỏi SSE request.

[[patch]]
id = "mcp-spawn-win-npx"
order = 25
summary = "browsermcp chạy Node kèm npx-cli.js, tương thích Windows không cần shell"
why = "Node 24 Windows: spawn('npx') → ENOENT, spawn('npx.cmd') → synchronous EINVAL; process.execPath + node_modules/npm/bin/npx-cli.js chạy native và giữ args tách biệt"
find = 'command:"npx",args:["-y","@browsermcp/mcp@latest"]'
replace = 'command:process.execPath,args:[require("path").join(require("path").dirname(process.execPath),"node_modules","npm","bin","npx-cli.js"),"-y","@browsermcp/mcp@latest"]'

[[patch]]
id = "mcp-spawn-error-guard"
order = 26
summary = "getOrSpawn: log spawn fail (sync throw giữ nguyên), gắn listener cho child error"
why = "child_process.spawn ném đồng bộ khi executable/path hỏng (Windows EINVAL với .cmd); lỗi đó được log kèm ngữ cảnh rồi ném tiếp như upstream — KHÔNG nuốt, vì getOrSpawn trả bridge rỗng thì registerSession sẽ nổ ở c.sessions.set. Listener f.on('error') lo nhánh async (ENOENT trên POSIX) vốn trước đây giết worker."
find = 'let f=d(e.command,e.args,{stdio:["pipe","pipe","pipe"],env:process.env});return c={proc:f,sessions:new Map,buffer:""},b.set(a,c),'
replace = 'let f;try{f=d(e.command,e.args,{stdio:["pipe","pipe","pipe"],env:process.env})}catch($x){console.error(`[mcp:${a}] spawn error: `+($x&&$x.message||$x));throw $x}f.on("error",$x=>{try{console.error(`[mcp:${a}] spawn error: `+($x&&$x.message||$x))}catch{}});return c={proc:f,sessions:new Map,buffer:""},b.set(a,c),'

