# P15 — deadline tổng per-attempt: env 9R_ATTEMPT_DEADLINE_MS (default 240000, <=0 tắt);
# cắt bằng c.handleError + c.abort() đúng cơ chế fallback. Watcher g() chỉ 1 bản trong 8895.js.
# LỊCH SỬ 2026-09-19 — hai lỗi của chính patch này, cùng lộ trong log prod:
#  1) replace chèn `Date.now()-x` nhưng g() khai báo i,j,k,l,m,n,o,p — KHÔNG có `x`. Re-anchor
#     0.5.81 remap find (q/p/m/o) mà bỏ sót replace → node --check vẫn pass (identifier hợp lệ)
#     còn timer nổ ReferenceError. Next.js log rồi nuốt (router-server.js:648) nên chỉ thành spam
#     `⨯ uncaughtException` chứ không giết process. Dùng `n` = mốc bắt đầu attempt (upstream đã
#     dùng cho dur=) — KHÔNG dùng `l` = mốc chunk cuối, bị transform gán lại mỗi chunk.
#  2) $td không được clearTimeout ở đâu cả, mà p() (đường dọn DUY NHẤT) lại chạy mỗi chunk qua
#     q() nên không thể nhét clear vào đó — nhét vào p() thì hạn chót chết ngay chunk đầu. Thay
#     bằng guard `!i`: i chỉ null sau terminal (handleComplete/Error/Disconnect/abort đều gọi p()),
#     nên timer sót của request đã xong thành no-op thay vì gọi handleError()/abort() lên attempt
#     đã đóng (fallback + log lỗi ma).

[[patch]]
id = "attempt-total-deadline"
order = 15
summary = "Deadline tổng 240s (env 9R_ATTEMPT_DEADLINE_MS) cho 1 attempt upstream — cắt stream kẹt"
why = "STALL/FIRST_CHUNK chỉ đo giữa-chunk; stream nhỏ giọt 7 phút không ai cắt, client tự hủy rồi router vẫn chạy tiếp phí"
find = 'q=()=>{p(),i=setTimeout(()=>{i=null,m="stream stall timeout",(0,e.s)(o,`STALL TIMEOUT ${h}ms | chunks=${j} | bytes=${k} | sinceLast=${Date.now()-l}ms`),c.handleError?.(Error("stream stall timeout")),c.abort?.()},h)},'
replace = 'q=()=>{p(),i=setTimeout(()=>{i=null,m="stream stall timeout",(0,e.s)(o,`STALL TIMEOUT ${h}ms | chunks=${j} | bytes=${k} | sinceLast=${Date.now()-l}ms`),c.handleError?.(Error("stream stall timeout")),c.abort?.()},h)},$tot=(+process.env["9R_ATTEMPT_DEADLINE_MS"]||240000),$td=$tot>0?setTimeout(()=>{if(!i)return;(0,e.s)(o,`ATTEMPT DEADLINE total=${Date.now()-n}ms (9R_ATTEMPT_DEADLINE_MS=${$tot})`),c.handleError?.(Error(`attempt deadline exceeded ${Date.now()-n}ms`)),c.abort?.()},$tot):null,'

# P16 — empty-stream→fallback: module 20623 hàm o/M trả {success:!0,response} NGAY LÚC HEADER
# về → combo quyết định trước khi biết stream rỗng (am/mt trả OUT 0 59-100%). Peek pipe đã-
# convert: tích đệm tới khi thấy evidence (text_delta/input_json_delta/delta.content/"text":/
# tool_calls/function_call/output_text.delta — thinking KHÔNG tính) rồi mới trả stream live;
# EOF sạch không evidence → {success:!1,status:502} đi đường khóa+fallback vk/hk như 5xx.
