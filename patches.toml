why = "am/mt trả stream rỗng (OUT 0) nhưng vẫn success → combo dừng, client nhận rỗng; peek nội dung trước khi trả để stream rỗng đi đường lỗi. 2026-09-25: regex cũ chỉ nhận text_delta/tool_calls nên thinking-only (TokenHarbor mimo-v2.6-flash, thinking adaptive) bị đợi tới 240s P15 deadline rồi gán oan 'empty stream' 502 + khoá key 30s"
