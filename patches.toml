    for (const $h of ["cf-connecting-ip","cf-connecting-ipv6","cf-pseudo-ipv4","true-client-ip","x-forwarded-for","x-forwarded-proto","x-forwarded-host","x-forwarded-port","x-forwarded-ssl","x-forwarded-server","x-real-ip","client-ip","forwarded","cf-worker"]) newRequestInit.headers.delete($h);'''

