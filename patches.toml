why = "DELETE /api/proxy-pools/[id] truoc day chi xoa row trong DB, Worker/Project/App/Site tren provider van song va van tinh quota. Teardown chay TRUOC khi xoa local va la best-effort: moi loi remote bi nuot trong try/catch cua $teardown nen khong bao gio chan viec xoa local. AbortSignal.timeout(15e3) de mot provider treo khong giu request xoa lau."
find = '''async function h(a,{params:b}){try{let{id:a}=await b;if(!await (0,e.hr)(a))return d.NextResponse.json({error:"Proxy pool not found"},{status:404});let c=await (0,e.getProviderConnections)(),f=function(a=[],b){return a.filter(a=>a?.providerSpecificData?.proxyPoolId===b).length}(c,a);if(f>0)return d.NextResponse.json({error:"Proxy pool is currently in use",boundConnectionCount:f},{status:409});return await (0,e.Yd)(a),d.NextResponse.json({success:!0})}'''
replace = '''async function $teardown(p){try{let m=p&&p.deployMeta;if(!m)return;if("cloudflare"===m.type&&m.accountId&&m.apiToken&&m.scriptName)await fetch("https://api.cloudflare.com/client/v4/accounts/"+m.accountId+"/workers/scripts/"+encodeURIComponent(m.scriptName)+"?force=true",{method:"DELETE",headers:{Authorization:"Bearer "+m.apiToken},signal:AbortSignal.timeout(15e3)});else if("vercel"===m.type&&m.vercelToken&&(m.projectId||m.projectName))await fetch("https://api.vercel.com/v9/projects/"+encodeURIComponent(m.projectId||m.projectName),{method:"DELETE",headers:{Authorization:"Bearer "+m.vercelToken},signal:AbortSignal.timeout(15e3)});else if("deno"===m.type&&m.denoToken&&m.appId)await fetch("https://api.deno.com/v2/apps/"+encodeURIComponent(m.appId),{method:"DELETE",headers:{Authorization:"Bearer "+m.denoToken},signal:AbortSignal.timeout(15e3)});else if("netlify"===m.type&&m.netlifyToken&&m.siteId)await fetch("https://api.netlify.com/api/v1/sites/"+encodeURIComponent(m.siteId),{method:"DELETE",headers:{Authorization:"Bearer "+m.netlifyToken},signal:AbortSignal.timeout(15e3)})}catch(e){console.warn("[9router] remote teardown skipped:",e&&e.message)}}
async function h(a,{params:b}){try{let{id:a}=await b;let $p=await (0,e.hr)(a);if(!$p)return d.NextResponse.json({error:"Proxy pool not found"},{status:404});let c=await (0,e.getProviderConnections)(),f=function(a=[],b){return a.filter(a=>a?.providerSpecificData?.proxyPoolId===b).length}(c,a);if(f>0)return d.NextResponse.json({error:"Proxy pool is currently in use",boundConnectionCount:f},{status:409});await $teardown($p);return await (0,e.Yd)(a),d.NextResponse.json({success:!0})}'''

